[project]
name = "embody-data-tool"
version = "0.1.0"
description = "Embodit — Embodied Intelligence Toolkit"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pyarrow",
  "numpy",
  "h5py",
  "mcap",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
